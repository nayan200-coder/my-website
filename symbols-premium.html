<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premium Symbols 3D</title>
  <style>
    html,body{height:100%;margin:0;background:#000;font-family:Segoe UI, Roboto, Arial}
    #symbols3D{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:5}
    /* Canvas styling requirement */
    #symbols3D canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      pointer-events: none;
    }
    /* Minimal debug overlay (pointer-events on) */
    #debugPanel{
      position:fixed;right:16px;top:16px;background:rgba(0,0,0,0.6);color:#0ff;border:2px solid #0ff;padding:12px;border-radius:8px;z-index:10;pointer-events:auto;font-family:monospace
    }
    #debugPanel button{margin-top:8px;display:block}
  </style>
</head>
<body>
  <div id="symbols3D"></div>
  <div id="debugPanel">
    <div id="status">Loading...</div>
    <button id="btnSymbols">Show Symbols</button>
    <button id="btnCube">Show Cube</button>
    <button id="btnAll">Show All</button>
  </div>

  <!-- Three.js core + loaders (non-module) -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

  <!-- Premium symbols script -->
  <script src="js/premium-symbols.js"></script>
</body>
</html>
